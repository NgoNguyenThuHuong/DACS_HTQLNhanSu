<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Hệ thống Quản lý Nhân sự Thông minh</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .bg-blob {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            animation: floating 25s infinite alternate;
        }

        @keyframes floating {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        .register-card {
            width: 100%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-custom {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            margin-bottom: 1.25rem;
        }

        .input-group-custom:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: white;
        }

        .input-group-custom i { color: #94a3b8; margin-right: 12px; }
        .input-group-custom input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            padding: 0.5rem 0;
            color: #1e293b;
            font-weight: 500;
        }

        .btn-register {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 16px;
            font-weight: 700;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-register:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
    <div class="bg-blob" style="top: -200px; left: -200px;"></div>
    
    <div class="register-card">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-dark mb-2">Tham gia hệ thống 🚀</h2>
            <p class="text-secondary small">Đăng ký tài khoản nhân viên mới</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-danger border-0 rounded-4 small py-2 mb-4" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                  <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Họ và tên</label>
                    <div class="input-group-custom">
                        <i class="fas fa-id-card"></i>
                        <input type="text" name="fullname" placeholder="Nguyễn Văn A" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Mã nhân viên</label>
                    <div class="input-group-custom">
                        <i class="fas fa-tag"></i>
                        <input type="text" name="employee_code" placeholder="NV123" required>
                    </div>
                </div>
            </div>

            <label class="form-label">Email công việc</label>
            <div class="input-group-custom">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="email@congty.com" required>
            </div>

            <label class="form-label">Tên đăng nhập</label>
            <div class="input-group-custom">
                <i class="fas fa-user-circle"></i>
                <input type="text" name="username" placeholder="Chon mot username" required>
            </div>

            <label class="form-label">Mật khẩu</label>
            <div class="input-group-custom">
                <i class="fas fa-key"></i>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-register">
                ĐĂNG KÝ NGAY <i class="fas fa-user-plus ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-secondary small">Đã có tài khoản? <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold text-decoration-none">Quay lại đăng nhập</a></p>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
